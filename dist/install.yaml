    app.kubernetes.io/name: llm-serving-operator
  name: llm-serving-operator-serving-cert
  namespace: llm-serving-operator-system
spec:
  dnsNames:
  - llm-serving-operator-webhook-service.llm-serving-operator-system.svc
  - llm-serving-operator-webhook-service.llm-serving-operator-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: llm-serving-operator-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: llm-serving-operator
  name: llm-serving-operator-selfsigned-issuer
  namespace: llm-serving-operator-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: llm-serving-operator-system/llm-serving-operator-serving-cert
  name: llm-serving-operator-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: llm-serving-operator-webhook-service
      namespace: llm-serving-operator-system
      path: /validate-serving-llmlab-dev-v1alpha1-modeldeployment
  failurePolicy: Fail
  name: vmodeldeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - serving.llmlab.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - modeldeployments
  sideEffects: None
