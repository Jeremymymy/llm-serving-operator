{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "llm-serving-operator.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  name: {{ include "llm-serving-operator.resourceName" (dict "suffix" "validating-webhook-configuration" "context" $) }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "llm-serving-operator.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-serving-llmlab-dev-v1alpha1-modeldeployment
  failurePolicy: Fail
  name: vmodeldeployment-v1alpha1.kb.io
  rules:
  - apiGroups:
    - serving.llmlab.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - modeldeployments
  sideEffects: None
{{- end }}
